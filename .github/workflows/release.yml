# Builds everything for a release tag (v1.2.3) and attaches it to the GitHub release:
# desktop apps (Windows, macOS, Linux), the Android APK and the Docker image on ghcr.io.
#
# Optional secrets for a release-signed APK (same key for every release, so updates install):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
# Without them the APK is signed with a debug key.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - {os: windows-latest, name: windows, file: Tapinion.exe}
          - {os: macos-latest, name: macos, file: Tapinion.app}
          - {os: ubuntu-latest, name: linux, file: Tapinion}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/pyinstaller/tapinion.spec
      - name: Package
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd dist
          case "${{ matrix.name }}" in
            windows) mv Tapinion.exe "Tapinion-$V-windows.exe" ;;
            macos)   ditto -c -k --keepParent Tapinion.app "Tapinion-$V-macos.zip" ;;
            linux)   tar czf "Tapinion-$V-linux.tar.gz" Tapinion ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist/Tapinion-*-windows.exe
            dist/Tapinion-*-macos.zip
            dist/Tapinion-*-linux.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "TAPINION_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "TAPINION_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          fi
      - run: bash ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/tapinion-android-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
