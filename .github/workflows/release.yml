# Builds everything for a release tag (v1.2.3) and attaches it to the GitHub release:
#   Windows installer (Tapinion-Setup-*.exe), macOS disk image (.dmg), Linux AppImage,
#   Android APK and the Docker image on ghcr.io. The desktop installers also carry the APK,
#   so tablets can download the app from the computer (/app).
# "Run workflow" (manual) builds the same files as downloadable artifacts, without a release.
#
# Optional secrets for a release-signed APK (same key for every release, so updates install):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
# Without them the APK is signed with a debug key.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android app for the download page (/app)
        uses: actions/download-artifact@v4
        with:
          name: android
          path: tapinion/apk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        shell: bash
        run: echo "version=$( [[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo "0.0.0-dev" )" >> "$GITHUB_OUTPUT"
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/pyinstaller/tapinion.spec
      - name: Installer (Inno Setup, preinstalled on the runner)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" packaging\windows\tapinion.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Tapinion-Setup-*.exe

  macos:
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android app for the download page (/app)
        uses: actions/download-artifact@v4
        with:
          name: android
          path: tapinion/apk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        run: echo "version=$( [[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo "0.0.0-dev" )" >> "$GITHUB_OUTPUT"
      - run: pip install . pyinstaller
      - name: App icon
        run: |
          mkdir tapinion.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s tapinion/static/icons/icon-512.png --out tapinion.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d tapinion/static/icons/icon-512.png --out tapinion.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns tapinion.iconset -o packaging/pyinstaller/tapinion.icns
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/pyinstaller/tapinion.spec
      - name: Disk image (drag Tapinion into Applications)
        run: |
          mkdir dmg && cp -R dist/Tapinion.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Tapinion -srcfolder dmg -ov -format UDZO "dist/Tapinion-${{ steps.v.outputs.version }}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    needs: android
    runs-on: ubuntu-22.04   # older glibc: the AppImage runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: Android app for the download page (/app)
        uses: actions/download-artifact@v4
        with:
          name: android
          path: tapinion/apk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        run: echo "version=$( [[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo "0.0.0-dev" )" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/pyinstaller/tapinion.spec
      - name: AppImage
        run: |
          mkdir -p AppDir/usr/lib
          cp -R dist/Tapinion AppDir/usr/lib/tapinion
          cp tapinion/static/icons/icon-512.png AppDir/tapinion.png
          cp packaging/linux/tapinion.desktop AppDir/tapinion.desktop
          cp packaging/linux/AppRun AppDir/AppRun && chmod +x AppDir/AppRun
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "dist/Tapinion-${{ steps.v.outputs.version }}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - id: v
        run: echo "version=$( [[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo "0.0.0-dev" )" >> "$GITHUB_OUTPUT"
      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "TAPINION_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "TAPINION_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          fi
      - run: bash ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: |
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/tapinion-android-${{ steps.v.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
