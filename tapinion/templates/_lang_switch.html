<form class="lang-switch" method="post" action="/lang">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="back" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
  {% for code in languages() %}
  <button name="lang" value="{{ code }}" class="{{ 'on' if code == lang }}" aria-pressed="{{ 'true' if code == lang else 'false' }}" title="{{ t('lang.' ~ code) }}">{{ code | upper }}</button>
  {% endfor %}
</form>
